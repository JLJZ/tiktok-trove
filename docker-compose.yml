services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=your-super-secret-jwt-key
      - USER_SERVICE_URL=http://user-service:3002
      - VIDEO_SERVICE_URL=http://video-service:3003
      - GIFT_SERVICE_URL=http://gift-service:3004
      - WALLET_SERVICE_URL=http://wallet-service:3005
    depends_on:
      - redis
    networks:
      - internal-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=user_service_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - internal-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - internal-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes

  user-service:
    build: ./user-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/user_service_db?schema=public
      - JWT_SECRET=your-super-secret-jwt
      - JWT_EXPIRES_IN=1h
      - REFRESH_TOKEN_EXPIRES_IN=7d
      - ALLOWED_ORIGINS=http://api-gateway:3000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs

  video-service:
    image: nginx:alpine
    ports:
      - "3003:80"
    networks:
      - internal-net
    volumes:
      - ./mock-responses:/usr/share/nginx/html
    restart: unless-stopped

  gift-service:
    image: nginx:alpine
    ports:
      - "3004:80"
    networks:
      - internal-net
    volumes:
      - ./mock-responses:/usr/share/nginx/html
    restart: unless-stopped

  wallet-service:
    image: nginx:alpine
    ports:
      - "3005:80"
    networks:
      - internal-net
    volumes:
      - ./mock-responses:/usr/share/nginx/html
    restart: unless-stopped

  # fraud-service:
  #   image: nginx:alpine
  #   ports:
  #     - "3006:80"
  #   networks:
  #     - internal-net
  #   volumes:
  #     - ./mock-responses:/usr/share/nginx/html
  #   restart: unless-stopped

networks:
  internal-net:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  pgadmin-data:
